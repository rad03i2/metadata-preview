[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-preview"
version = "1.0.0"
description = "Privacy-first local file metadata inspector for images, PDFs, and general files."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
dependencies = ["Pillow>=10,<13", "pypdf>=5,<7"]

[project.scripts]
metadata-preview = "metadata_preview.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
